name: Build Linux wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "0.2.5.post1"

permissions:
  contents: write

jobs:
  linux-x86-64:
    name: Linux x86_64 wheels
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build wheels
        run: bash scripts/build_all_manylinux_x86_64.sh

      - name: Check wheels
        run: |
          python3 -m pip install -U twine
          python3 -m twine check wheelhouse_x86_64/*.whl

      - name: Smoke test every wheel
        run: bash scripts/smoke_test_wheels.sh wheelhouse_x86_64 quay.io/pypa/manylinux2014_x86_64:latest

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-wheels
          path: wheelhouse_x86_64/*.whl
          if-no-files-found: error

  linux-aarch64:
    name: Linux aarch64 wheels
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build and wheel tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            zip \
            unzip

      - name: Build wheels
        run: bash scripts/build_all_manylinux_aarch64.sh

      - name: Check wheels
        run: |
          python3 -m pip install -U twine
          python3 -m twine check wheelhouse_aarch64/*.whl

      - name: Smoke test every wheel
        run: bash scripts/smoke_test_wheels.sh wheelhouse_aarch64 quay.io/pypa/manylinux2014_aarch64:latest

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64-wheels
          path: wheelhouse_aarch64/*.whl
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - linux-x86-64
      - linux-aarch64
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find release-assets -name '*.whl' -type f | sort)
          test "${#assets[@]}" -eq 8
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --title "v${GITHUB_REF_NAME} - Simplified diverse Block selection" \
            --notes-file CHANGELOG.md
