[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
    "numpy>=1.23,<2.0; python_version < '3.13'",
    "numpy>=2.1,<2.3; python_version >= '3.13'",
]
build-backend = "setuptools.build_meta"

[project]
name = "codec-video-prep"
version = "0.2.5.post4"
description = "Codec-aware video preprocessing with simplified diverse block selection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["video", "codec", "bitcost", "preprocessing", "ffmpeg", "h264", "hevc", "vp9"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23,<2.0; python_version < '3.13'",
    "numpy>=2.1,<2.3; python_version >= '3.13'",
    "opencv-python-headless<4.12",
    "Pillow>=10,<12",
]

[project.scripts]
codec-video-prep = "codec_video_prep.cli:main"
codec-video-prep-legacy-exact = "codec_video_prep.cli:main"
codec-video-prep-doctor = "codec_video_prep.doctor:main"
cv-preinfer = "compressed_video_preinfer.cli:main"
cv-preinfer-doctor = "compressed_video_preinfer.doctor:main"

[project.urls]
Homepage = "https://github.com/Seadraco/codec-video-prep-simplified"
Documentation = "https://github.com/Seadraco/codec-video-prep-simplified#readme"
Issues = "https://github.com/Seadraco/codec-video-prep-simplified/issues"
